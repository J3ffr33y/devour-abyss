<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>深渊之种 手感原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-screen canvas, HUD pinned to corners, tuning drawer on the right. Single dark deep-sea look by design. */
:root {
  --abyss: #03070d;
  --ink: #d8eef5;
  --dim: #7f9bab;
  --bio: #5ff2d4;
  --warn: #ff6b5a;
  --amber: #f3c56b;
  --panel: rgba(6, 16, 26, 0.86);
  --line: rgba(120, 190, 210, 0.22);
  --f-display: "Noto Serif SC", "Songti SC", serif;
  --f-body: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--abyss); color: var(--ink); font-family: var(--f-body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; pointer-events: none; font-size: 12px; }
#hudL { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 6px; min-width: 180px; }
.bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; width: 180px; }
.bar > i { display: block; height: 100%; width: 100%; }
#energy > i { background: var(--bio); }
#hp > i { background: var(--warn); }
.lbl { color: var(--dim); letter-spacing: 0.08em; font-size: 11px; }
.data { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
#organs { display: flex; gap: 6px; margin-top: 4px; }
.slot { width: 54px; height: 22px; border: 1px solid var(--line); border-radius: 4px; display: grid; place-items: center; font-size: 11px; color: var(--dim); }
.slot.on { border-color: var(--bio); color: var(--bio); }
.slot.cd { opacity: 0.45; }
#hudR { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); text-align: right; display: grid; gap: 4px; }
#toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); font-family: var(--f-display); font-size: 22px; letter-spacing: 0.2em; color: var(--bio); text-shadow: 0 0 18px rgba(95,242,212,0.6); opacity: 0; transition: opacity .4s; pointer-events: none; text-align: center; white-space: nowrap; }
#hint { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); color: var(--dim); font-size: 12px; pointer-events: none; text-align: center; max-width: 90vw; }
button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--bio); outline-offset: 2px; }
#tuneBtn { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--panel); }
#tune { position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 92vw); background: var(--panel); border-left: 1px solid var(--line); padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px 16px; overflow-y: auto; display: grid; gap: 10px; align-content: start; backdrop-filter: blur(6px); }
#tune h2 { font-family: var(--f-display); font-weight: 600; font-size: 16px; margin: 0; letter-spacing: 0.1em; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.row label { font-size: 12px; }
.row output { font-family: var(--f-data); font-size: 11px; color: var(--bio); }
.row input { grid-column: 1 / -1; width: 100%; accent-color: var(--bio); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
#title { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(20,60,70,0.55), var(--abyss) 70%); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
#title .box { max-width: 460px; display: grid; gap: 14px; text-align: center; }
#title h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(30px, 8vw, 44px); letter-spacing: 0.25em; margin: 0; text-wrap: balance; }
#title .sub { color: var(--dim); letter-spacing: 0.3em; font-size: 12px; }
#title table { margin: 0 auto; border-collapse: collapse; font-size: 13px; text-align: left; }
#title td { padding: 3px 10px; }
#title td:first-child { font-family: var(--f-data); color: var(--bio); white-space: nowrap; }
#start { font-size: 16px; padding: 10px 28px; border-color: var(--bio); color: var(--bio); justify-self: center; letter-spacing: 0.3em; }
.touch { position: fixed; pointer-events: auto; }
#tDash, #tLight { width: 64px; height: 64px; border-radius: 50%; background: rgba(6,16,26,0.6); font-size: 13px; }
#tDash { right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
#tLight { right: calc(100px + env(safe-area-inset-right, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono&display=swap">

<canvas id="game"></canvas>

<div class="hud" id="hudL">
  <div class="lbl">能量</div><div class="bar" id="energy"><i></i></div>
  <div class="lbl">生命</div><div class="bar" id="hp"><i></i></div>
  <div id="organs"><div class="slot" id="sDash">冲刺</div><div class="slot" id="sLight">发光</div></div>
</div>
<div class="hud" id="hudR">
  <div><span class="lbl">深度 </span><span class="data" id="depth">0 m</span></div>
  <div><span class="lbl">体长 </span><span class="data" id="size">3.0 mm</span></div>
  <div><span class="lbl">吞噬 </span><span class="data" id="eaten">0</span></div>
</div>
<div id="toast"></div>
<div id="hint"></div>
<button id="tuneBtn" type="button">参数 (T)</button>
<button id="tDash" class="touch" type="button" hidden>冲刺</button>
<button id="tLight" class="touch" type="button" hidden>发光</button>

<aside id="tune" hidden>
  <h2>手感参数</h2>
  <div class="lbl">拖动滑块会立即生效，会保存在本机浏览器。</div>
  <div id="sliders"></div>
  <div class="btns">
    <button type="button" id="copyP">复制参数</button>
    <button type="button" id="resetP">恢复默认</button>
    <button type="button" id="giveAll">直接给全部器官</button>
    <button type="button" id="closeT">关闭</button>
  </div>
  <div class="lbl" id="copyMsg"></div>
</aside>

<div id="title">
  <div class="box">
    <div class="sub">DEVOUR · ECHOES OF THE ABYSS</div>
    <h1>深渊之种</h1>
    <div class="sub">手感原型 v0.2</div>
    <table>
      <tr><td>WASD / 方向键</td><td>游动（或按住鼠标左键朝指针游）</td></tr>
      <tr><td>空格 / Shift</td><td>冲刺（需要先吞下银色箭鱼）</td></tr>
      <tr><td>F</td><td>发光开关（需要先吞下发光水母）</td></tr>
      <tr><td>T / M</td><td>手感参数面板 / 静音</td></tr>
      <tr><td>手机</td><td>左半屏拖动摇杆，右下角按钮</td></tr>
    </table>
    <div style="color:var(--dim);font-size:12px">碰到比你小的生物会自动吞下。比你大的掠食者会追你，看到头顶「!」就快跑。</div>
    <button id="start" type="button">开始</button>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

// ---------- tunable feel parameters ----------
const DEFAULTS = {
  accel: 900, drag: 2.6, maxSpeed: 190, turnRate: 9,
  dashPower: 520, dashCooldown: 1.1, biteReach: 1.6, growth: 1.0,
  camLag: 5, lookAhead: 0.35, hitstop: 0.06, shake: 1.2,
  suction: 1.0, chaseGiveUp: 4, retreatTime: 5,
};
const LABELS = {
  accel: ['加速度', 200, 2500, 10], drag: ['水阻（越大越快停下）', 0.3, 8, 0.1], maxSpeed: ['最高速度', 60, 400, 5],
  turnRate: ['转身速度', 1, 25, 0.5], dashPower: ['冲刺力度', 150, 1200, 10], dashCooldown: ['冲刺冷却 (秒)', 0.2, 4, 0.1],
  biteReach: ['嘴的判定范围', 0.6, 2.5, 0.05], growth: ['成长倍率', 0.2, 5, 0.1],
  camLag: ['镜头跟随速度', 1, 15, 0.5], lookAhead: ['镜头前瞻', 0, 1, 0.05], hitstop: ['吞噬顿帧 (秒)', 0, 0.15, 0.01], shake: ['震屏强度', 0, 3, 0.1],
  suction: ['吸食力度', 0, 3, 0.1], chaseGiveUp: ['掠食者追多久没咬到就放弃 (秒)', 1, 12, 0.5], retreatTime: ['放弃后多久不再攻击 (秒)', 0, 15, 0.5],
};
let P = { ...DEFAULTS };
try { const s = JSON.parse(localStorage.getItem('abyss-feel') || 'null'); if (s) Object.assign(P, s); } catch (e) {}
const saveP = () => { try { localStorage.setItem('abyss-feel', JSON.stringify(P)); } catch (e) {} };

// ---------- world ----------
const W = 5200, H = 3300;
const floor = [];
for (let i = 0; i <= W / 100 + 1; i++) floor.push(2950 + Math.sin(i * 0.37) * 120 + Math.sin(i * 1.3) * 45 + (i % 9 === 0 ? -260 : 0));
const floorY = x => { const i = Math.max(0, Math.min(floor.length - 2, Math.floor(x / 100))); const t = x / 100 - i; return floor[i] * (1 - t) + floor[i + 1] * t; };
const START = { x: 900, y: 520 };
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

// marine snow
const snow = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(), z: rand(0.3, 1), s: rand(0.5, 1.8) }));

// ---------- player ----------
const pl = {
  x: START.x, y: START.y, vx: 0, vy: 0, ang: 0, mass: 1, r: 6, energy: 100, hp: 100,
  dash: false, light: false, lightOn: false, dashCd: 0, noise: 0, jaw: 0, hurtT: 0, dead: 0, eaten: 0,
  squash: 0, chomp: 0, gulps: [], combo: 0, comboT: 0,
  tail: [],
};
const resetTail = () => { pl.tail = Array.from({ length: 9 }, (_, i) => ({ x: pl.x - i * 3, y: pl.y })); };
resetTail();

// ---------- creatures ----------
const TYPES = {
  plankton: { r: [1.6, 2.6], spd: 18, color: '#9ff7ff', glow: true, food: 3, depth: [0, 3200] },
  minnow:   { r: [3.2, 6.5], spd: 150, color: '#b9cfd9', food: 9, depth: [100, 1500] },
  shrimp:   { r: [3.5, 5.5], spd: 60, color: '#e8907a', food: 7, depth: [700, 2700] },
  jelly:    { r: [9, 12], spd: 22, color: '#5ff2d4', glow: true, food: 12, depth: [500, 2400], organ: 'light' },
  dart:     { r: [8, 10], spd: 250, color: '#e9f2f6', food: 14, depth: [200, 1800], organ: 'dash' },
  pred:     { r: [24, 34], spd: 175, color: '#5d6f7a', food: 40, depth: [500, 2800] },
  brute:    { r: [70, 80], spd: 120, color: '#3a4650', food: 120, depth: [2000, 2900] },
};
const cs = [];
let schoolId = 0;
function spawn(type, x, y, school) {
  const T = TYPES[type];
  if (x === undefined) {
    let tries = 0;
    do { x = rand(100, W - 100); y = rand(T.depth[0] + 40, Math.min(T.depth[1], H - 400)); tries++; }
    while (tries < 20 && Math.hypot(x - pl.x, y - pl.y) < 700);
  }
  const c = { type, x, y, vx: 0, vy: 0, r: rand(T.r[0], T.r[1]), ang: rand(0, 6.28), t: rand(0, 10), state: 'wander', st: 0, stamina: 1, cd: 0, school, wob: rand(0, 6.28), alive: true };
  cs.push(c); return c;
}
function spawnSchool() {
  const T = TYPES.minnow; let x, y, tries = 0;
  do { x = rand(200, W - 200); y = rand(T.depth[0] + 60, T.depth[1]); tries++; } while (tries < 20 && Math.hypot(x - pl.x, y - pl.y) < 700);
  const id = ++schoolId; const n = 6 + (Math.random() * 6 | 0);
  for (let i = 0; i < n; i++) spawn('minnow', x + rand(-40, 40), y + rand(-25, 25), id);
}
function populate() {
  cs.length = 0;
  for (let i = 0; i < 650; i++) spawn('plankton');
  for (let i = 0; i < 26; i++) spawnSchool();
  for (let i = 0; i < 70; i++) spawn('shrimp');
  for (let i = 0; i < 22; i++) spawn('jelly');
  for (let i = 0; i < 12; i++) spawn('dart');
  for (let i = 0; i < 11; i++) spawn('pred');
  for (let i = 0; i < 2; i++) spawn('brute');
  // guarantee one jelly and one dart near the start so organs are reachable
  spawn('jelly', START.x + 520, START.y + 260);
  spawn('dart', START.x - 380, START.y + 120);
  // a food-rich nursery around the start so the first seconds are about eating
  for (let i = 0; i < 70; i++) spawn('plankton', START.x + rand(-450, 450), START.y + rand(-250, 300));
  const id = ++schoolId;
  for (let i = 0; i < 7; i++) { const c = spawn('minnow', START.x + 260 + rand(-30, 30), START.y - 60 + rand(-20, 20), id); c.r = rand(3.2, 4.4); }
}
populate();
const respawnQ = [];

// ---------- particles / fx ----------
const parts = [];
const puff = (x, y, n, color, spd, life, size) => { for (let i = 0; i < n; i++) { const a = rand(0, 6.28), s = rand(0.2, 1) * spd; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size: size * rand(0.5, 1.2) }); } };
let shakeT = 0, shakeMag = 0, hitstopT = 0;
const swallows = [];   // prey being pulled into the mouth
const floats = [];     // floating combo text
// ---------- sound (synthesized, no files) ----------
let AC = null, muted = false;
function initAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; } }
function tone(f0, f1, dur, vol, type = 'sine') {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!AC || muted) return;
  const t = AC.currentTime, n = AC.sampleRate * dur | 0, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8; g.gain.value = vol;
  src.buffer = buf; src.connect(f).connect(g).connect(AC.destination); src.start(t);
}
const sGulp = (size, combo) => { const p = clamp(1 - size / 30, 0.25, 1); tone(260 * p + 40 + combo * 18, 50 * p + 25, 0.13 + (1 - p) * 0.12, 0.35); noise(0.06, 0.25, 900 * p + 200); };
const shake = (m, t) => { shakeMag = Math.max(shakeMag, m * P.shake); shakeT = Math.max(shakeT, t); };
let toastT = 0;
function toast(msg, t = 2.6) { const el = $('toast'); el.textContent = msg; el.style.opacity = 1; toastT = t; }

// ---------- input ----------
const keys = new Set();
const mouse = { down: false, x: 0, y: 0 };
const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0, active: false };
let isTouch = false;
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase(); keys.add(k);
  if (k === ' ' || k === 'shift') tryDash();
  if (k === 'f') toggleLight();
  if (k === 't') toggleTune();
  if (k === 'm') { muted = !muted; hint(muted ? '已静音（M 恢复）' : '声音已开启', 1.5); }
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') {
    if (!isTouch) { isTouch = true; $('tDash').hidden = false; $('tLight').hidden = false; }
    if (e.clientX < innerWidth * 0.6 && stick.id === null) { stick.id = e.pointerId; stick.ox = stick.x = e.clientX; stick.oy = stick.y = e.clientY; stick.active = true; }
  } else if (e.button === 0) { mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId === stick.id) { stick.x = e.clientX; stick.y = e.clientY; }
  if (e.pointerType !== 'touch') { mouse.x = e.clientX; mouse.y = e.clientY; }
});
const endPtr = e => { if (e.pointerId === stick.id) { stick.id = null; stick.active = false; } if (e.pointerType !== 'touch') mouse.down = false; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
$('tDash').addEventListener('pointerdown', e => { e.preventDefault(); tryDash(); });
$('tLight').addEventListener('pointerdown', e => { e.preventDefault(); toggleLight(); });

function inputDir() {
  let x = 0, y = 0;
  if (keys.has('a') || keys.has('arrowleft')) x -= 1;
  if (keys.has('d') || keys.has('arrowright')) x += 1;
  if (keys.has('w') || keys.has('arrowup')) y -= 1;
  if (keys.has('s') || keys.has('arrowdown')) y += 1;
  let m = Math.hypot(x, y); if (m > 0) return { x: x / m, y: y / m };
  if (stick.active) {
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy);
    if (d > 6) { const k = Math.min(1, d / 60); return { x: dx / d * k, y: dy / d * k }; }
  }
  if (mouse.down) {
    const w = screenToWorld(mouse.x, mouse.y); const dx = w.x - pl.x, dy = w.y - pl.y, d = Math.hypot(dx, dy);
    if (d > pl.r) { const k = Math.min(1, d / 120); return { x: dx / d * k, y: dy / d * k }; }
  }
  return { x: 0, y: 0 };
}

function tryDash() {
  if (pl.dead || !running) return;
  if (!pl.dash) { hint('还没有冲刺器官。找一条银色的箭鱼吞下去。', 2.5); return; }
  if (pl.dashCd > 0 || pl.energy < 12) return;
  const d = inputDir(); const a = (d.x || d.y) ? Math.atan2(d.y, d.x) : pl.ang;
  pl.vx += Math.cos(a) * P.dashPower; pl.vy += Math.sin(a) * P.dashPower;
  pl.ang = a; pl.dashCd = P.dashCooldown; pl.energy -= 12; pl.noise = 1;
  puff(pl.x, pl.y, 14, 'rgba(200,240,255,0.8)', 120, 0.45, 2.2);
  shake(2, 0.12); noise(0.25, 0.35, 500);
}
function toggleLight() {
  if (pl.dead || !running) return;
  if (!pl.light) { hint('还没有发光器官。深一点的地方有发光水母。', 2.5); return; }
  pl.lightOn = !pl.lightOn;
}

// ---------- camera ----------
const cam = { x: START.x, y: START.y, z: 1.6 };
let VW = 0, VH = 0, DPR = 1, baseScale = 1;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight;
  cv.width = VW * DPR; cv.height = VH * DPR; baseScale = Math.min(VW, VH) / 620;
  dark.width = cv.width; dark.height = cv.height;
}
const dark = document.createElement('canvas'); const dctx = dark.getContext('2d');
addEventListener('resize', resize);
const scale = () => cam.z * baseScale;
function screenToWorld(sx, sy) { const s = scale(); return { x: (sx - VW / 2) / s + cam.x, y: (sy - VH / 2) / s + cam.y }; }

// ---------- hint ----------
let hintT = 0;
function hint(msg, t = 4) { $('hint').textContent = msg; hintT = t; }

// ---------- update ----------
let running = false, last = 0, time = 0;
const playerVision = () => pl.lightOn ? 420 + pl.r * 3 : 150 + pl.r * 3.2;

function grow(prey) {
  const gain = Math.pow(prey.r / 6, 2) * 0.32 * P.growth;
  pl.mass = Math.min(110, pl.mass + gain);
}

function eat(c) {
  c.alive = false; pl.eaten++;
  const T = TYPES[c.type];
  pl.energy = Math.min(100, pl.energy + T.food); pl.hp = Math.min(100, pl.hp + T.food * 0.3);
  grow(c);
  // chomp: jaw snaps shut, body squashes, a bulge travels down the body
  pl.jaw = 0; pl.chomp = 0.14; pl.squash = Math.min(1, 0.35 + c.r / pl.r);
  pl.gulps.push({ pos: 0, size: Math.min(0.6, c.r / pl.r) });
  swallows.push({ x: c.x, y: c.y, r: c.r, t: 0, type: c.type, ang: c.ang });

  }
  const sx = (Math.random() - 0.5) * shakeMag, sy = (Math.random() - 0.5) * shakeMag;
  ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * (VW / 2 - cam.x * s + sx), DPR * (VH / 2 - cam.y * s + sy));
  const vx0 = cam.x - VW / 2 / s - 100, vx1 = cam.x + VW / 2 / s + 100, vy0 = top - 100, vy1 = bot + 100;
  // giant ribs near the start: the bones that are still moving
  ctx.save(); ctx.strokeStyle = 'rgba(205,200,180,0.16)'; ctx.lineCap = 'round';
  const breathe = 1 + Math.sin(time * 0.6) * 0.02;
  for (let i = 0; i < 9; i++) {
    const bx = 300 + i * 150, by = 1250; ctx.lineWidth = 28 - i;
    ctx.beginPath(); ctx.ellipse(bx, by, 70 * breathe, 520 * breathe, 0.15, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  }
  ctx.lineWidth = 40; ctx.beginPath(); ctx.moveTo(220, 760); ctx.quadraticCurveTo(900, 690, 1700, 800); ctx.stroke();
  ctx.restore();
  // sea floor
  ctx.fillStyle = '#04090f';
  ctx.beginPath(); ctx.moveTo(vx0, H + 200);
  for (let x = Math.floor(vx0 / 100) * 100; x <= vx1 + 100; x += 50) ctx.lineTo(x, floorY(clamp(x, 0, W)));
  ctx.lineTo(vx1 + 100, H + 200); ctx.fill();
  // non-glowing creatures
  for (const c of cs) {
    if (!c.alive || c.x < vx0 || c.x > vx1 || c.y < vy0 || c.y > vy1) continue;
    const T = TYPES[c.type]; if (T.glow) continue;
    if (c.type === 'pred' || c.type === 'brute') drawPred(c, T);
    else if (c.type === 'shrimp') { ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.ang); ctx.strokeStyle = T.color; ctx.lineWidth = c.r * 0.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(-c.r * 0.3, 0, c.r, -0.9, 1.6); ctx.stroke(); ctx.restore(); }
    else drawFish(c, T, s);
  }
  for (const sw of swallows) {
    const mx = pl.x + Math.cos(pl.ang) * pl.r * 0.6, my = pl.y + Math.sin(pl.ang) * pl.r * 0.6, e = sw.t * sw.t;
    const T = TYPES[sw.type]; ctx.globalAlpha = 1 - sw.t * 0.6;
    ctx.fillStyle = T.color; ctx.beginPath(); ctx.arc(sw.x + (mx - sw.x) * e, sw.y + (my - sw.y) * e, sw.r * (1 - e * 0.85), 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawPlayer();
  // darkness overlay with vision hole
  const depthT = clamp((pl.y - 150) / 2200, 0, 1);
  const darkA = 0.25 + depthT * 0.72;
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.globalCompositeOperation = 'source-over'; dctx.clearRect(0, 0, dark.width, dark.height);
  dctx.fillStyle = `rgba(1,4,9,${darkA})`; dctx.fillRect(0, 0, dark.width, dark.height);
  dctx.globalCompositeOperation = 'destination-out';
  const px = DPR * (VW / 2 + (pl.x - cam.x) * s + sx), py = DPR * (VH / 2 + (pl.y - cam.y) * s + sy);
  const vr = playerVision() * s * DPR * (pl.dead ? 0.3 : 1);
  const vg = dctx.createRadialGradient(px, py, vr * 0.15, px, py, vr);
  vg.addColorStop(0, 'rgba(0,0,0,1)'); vg.addColorStop(0.6, 'rgba(0,0,0,0.75)'); vg.addColorStop(1, 'rgba(0,0,0,0)');
  dctx.fillStyle = vg; dctx.beginPath(); dctx.arc(px, py, vr, 0, 6.28); dctx.fill();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dark, 0, 0); ctx.restore();
  // glowing things on top of the dark
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const c of cs) {
    if (!c.alive || c.x < vx0 || c.x > vx1 || c.y < vy0 || c.y > vy1) continue;
    const T = TYPES[c.type]; if (!T.glow) continue;
    if (c.type === 'plankton') {
      const a = 0.45 + 0.35 * Math.sin(c.t * 3 + c.wob);
      ctx.fillStyle = `rgba(150,245,255,${a})`; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 6.28); ctx.fill();
    } else {
      const pulse = Math.max(0, Math.sin(c.t * 2.2));
      const rg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * 3);
      rg.addColorStop(0, 'rgba(95,242,212,0.35)'); rg.addColorStop(1, 'rgba(95,242,212,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 3, 0, 6.28); ctx.fill();
      ctx.fillStyle = 'rgba(95,242,212,0.6)'; ctx.beginPath(); ctx.ellipse(c.x, c.y, c.r * (1 + pulse * 0.15), c.r * (0.75 - pulse * 0.1), 0, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = 'rgba(95,242,212,0.45)'; ctx.lineWidth = 0.8;
      for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(c.x + k * c.r * 0.35, c.y); ctx.quadraticCurveTo(c.x + k * c.r * 0.35 + Math.sin(c.t * 2 + k) * 3, c.y + c.r, c.x + k * c.r * 0.3, c.y + c.r * 2); ctx.stroke(); }
    }
  }
  // predator eyes glow in the dark, so danger is readable
  for (const c of cs) {
    if (!c.alive || (c.type !== 'pred' && c.type !== 'brute') || c.x < vx0 || c.x > vx1 || c.y < vy0 || c.y > vy1) continue;
    const ex = c.x + Math.cos(c.ang) * c.r * 0.95, ey = c.y + Math.sin(c.ang) * c.r * 0.95;
    ctx.fillStyle = c.state === 'chase' || c.state === 'notice' ? 'rgba(255,107,90,0.9)' : 'rgba(200,220,230,0.25)';
    ctx.beginPath(); ctx.arc(ex, ey, Math.max(1.5, c.r * 0.09), 0, 6.28); ctx.fill();
  }
  // player core and light
  if (!pl.dead) {
    ctx.fillStyle = 'rgba(95,242,212,0.5)'; ctx.beginPath(); ctx.arc(pl.x - Math.cos(pl.ang) * pl.r * 0.25, pl.y - Math.sin(pl.ang) * pl.r * 0.25, pl.r * 0.3, 0, 6.28); ctx.fill();
    if (pl.light) {
      const lx = pl.x + Math.cos(pl.ang) * pl.r * 1.5 - Math.sin(pl.ang) * -pl.r * 1.2, ly = pl.y + Math.sin(pl.ang) * pl.r * 1.5 + Math.cos(pl.ang) * -pl.r * 1.2;
      const on = pl.lightOn ? 1 : 0.2;
      const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, pl.r * 2.2);
      lg.addColorStop(0, `rgba(243,197,107,${0.9 * on})`); lg.addColorStop(1, 'rgba(243,197,107,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx, ly, pl.r * 2.2, 0, 6.28); ctx.fill();
    }
  }
  for (const p of parts) { ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.28); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.restore();
  // "!" warnings above predators that noticed you
  ctx.font = `bold ${Math.max(14, 18)}px ${getComputedStyle(document.documentElement).getPropertyValue('--f-data')}`;
  ctx.textAlign = 'center';
  for (const c of cs) {
    if (!c.alive || c.state !== 'notice') continue;
    ctx.save(); ctx.translate(c.x, c.y - c.r * 1.4); ctx.scale(1 / s, 1 / s);
    ctx.fillStyle = '#ff6b5a'; ctx.fillText('!', 0, 0); ctx.restore();
  }
  for (const f of floats) {
    ctx.save(); ctx.translate(f.x, f.y); ctx.scale(1 / s, 1 / s); ctx.globalAlpha = Math.min(1, f.t * 2);
    ctx.fillStyle = '#5ff2d4'; ctx.font = '600 16px "Noto Serif SC", serif'; ctx.fillText(f.txt, 0, 0); ctx.restore();
  }
  // joystick
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (stick.active) {
    ctx.strokeStyle = 'rgba(216,238,245,0.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 60, 0, 6.28); ctx.stroke();
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy), k = Math.min(1, 60 / (d || 1));
    ctx.fillStyle = 'rgba(216,238,245,0.3)'; ctx.beginPath(); ctx.arc(stick.ox + dx * k, stick.oy + dy * k, 24, 0, 6.28); ctx.fill();
  }
}

function updateHud() {
  $('energy').firstElementChild.style.width = pl.energy + '%';
  $('hp').firstElementChild.style.width = Math.max(0, pl.hp) + '%';
  $('depth').textContent = Math.round(pl.y / 3) + ' m';
  $('size').textContent = (pl.r * 0.5).toFixed(1) + ' mm';
  $('eaten').textContent = pl.eaten;
  const sd = $('sDash'), sl = $('sLight');
  sd.classList.toggle('on', pl.dash); sd.classList.toggle('cd', pl.dash && pl.dashCd > 0);
  sl.classList.toggle('on', pl.light && pl.lightOn);
  sd.textContent = pl.dash ? '冲刺' : '— 空 —'; sl.textContent = pl.light ? (pl.lightOn ? '发光 开' : '发光 关') : '— 空 —';
}

function frame(t) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
  if (!running) { render(); return; }
  time += dt;
  updateFx(dt);
  if (hitstopT > 0) { hitstopT -= dt; dt = 0; }
  if (dt > 0) { updatePlayer(dt); updateCreatures(dt); }
  updateCamera(Math.max(dt, 0.001));
  render(); updateHud();
}

// ---------- tuning panel ----------
function buildSliders() {
  const box = $('sliders'); box.innerHTML = '';
  for (const k of Object.keys(DEFAULTS)) {
    const [name, mn, mx, st] = LABELS[k];
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label for="p_${k}">${name}</label><output id="o_${k}">${P[k]}</output><input type="range" id="p_${k}" min="${mn}" max="${mx}" step="${st}" value="${P[k]}">`;
    box.appendChild(row);
    row.querySelector('input').addEventListener('input', e => { P[k] = +e.target.value; row.querySelector('output').textContent = P[k]; saveP(); });
  }
}
function toggleTune() { $('tune').hidden = !$('tune').hidden; }
$('tuneBtn').addEventListener('click', toggleTune);
$('closeT').addEventListener('click', toggleTune);
$('resetP').addEventListener('click', () => { P = { ...DEFAULTS }; saveP(); buildSliders(); });
$('giveAll').addEventListener('click', () => { pl.dash = true; pl.light = true; toast('已获得全部器官'); });
$('copyP').addEventListener('click', () => {
  const txt = JSON.stringify(P);
  const done = ok => { $('copyMsg').textContent = ok ? '已复制。把它发给 Claude 就能写进默认值。' : '复制失败，下面是参数：' + txt; };
  try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (e) { done(false); }
});
buildSliders();

$('start').addEventListener('click', () => {
  $('title').hidden = true; running = true; initAudio();
  hint('你很小。先吃发光的浮游生物和小鱼，慢慢长大。', 6);
});
resize();
requestAnimationFrame(frame);
})();
</script>
</body></html>
